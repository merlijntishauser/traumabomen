map $host $og_lang {
    "~*traumabomen"  "nl";
    default          "en";
}

map $host $og_locale {
    "~*traumabomen"  "nl_NL";
    default          "en_US";
}

map $host $og_title {
    "~*traumabomen"  "Traumabomen | Genogram maken, gratis en privacyvriendelijk";
    default          "Traumatrees | Free privacy-first genogram maker";
}

map $host $og_desc {
    "~*traumabomen"  "Maak een genogram en breng intergenerationeel trauma in kaart op visuele stambomen. Gratis en zero-knowledge versleuteld; wij kunnen jouw gegevens nooit lezen.";
    default          "Map intergenerational trauma on a visual genogram of your family. Free and zero-knowledge encrypted; we can never read your data.";
}

map $host $og_origin {
    "~*traumabomen"  "https://www.traumabomen.nl";
    default          "https://www.traumatrees.org";
}

# Same-language alternate (the EN/NL counterpart used in <link rel="alternate" hreflang>).
map $host $og_alt_en {
    default          "https://www.traumatrees.org";
}

map $host $og_alt_nl {
    default          "https://www.traumabomen.nl";
}

# The genogram landing page has a language-fixed path per host (used by the
# sitemap loc; the page files themselves are prerendered with baked heads).
map $host $genogram_path {
    "~*traumabomen"  "/genogram-maken";
    default          "/genogram";
}

# Each genogram edition belongs to one host: /genogram is the English page on
# traumatrees.org, /genogram-maken the Dutch one on traumabomen.nl. Both paths
# resolve on both hosts because one container serves both domains, which
# duplicates each page under the wrong domain. The page canonicals to the host
# that owns it, so Google files the copy as "alternative page with proper
# canonical tag" rather than indexing it. Redirect instead of relying on the
# canonical hint, so the wrong-language URL stops being a crawlable duplicate.
# Empty means the requested edition belongs to this host: serve it normally.
map $og_lang $genogram_en_offhost {
    "nl"             "https://www.traumatrees.org/genogram";
    default          "";
}

map $og_lang $genogram_nl_offhost {
    "en"             "https://www.traumabomen.nl/genogram-maken";
    default          "";
}

# Strip query string from $request_uri so the canonical doesn't fragment on
# tracking params. $uri can't be used here because try_files rewrites it to
# /index.html for every SPA route.
map $request_uri $canonical_path {
    ~^([^?]*)  $1;
    default    /;
}

limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_general:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_global:10m rate=120r/m;
limit_req_status 429;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    set_real_ip_from 169.254.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy. script-src is hash-pinned to the two inline
    # bootstrap scripts in index.html (theme + 1Password suppression); if you
    # edit either script, recompute its sha256 and update the hash here.
    # 'wasm-unsafe-eval' is required for the argon2 WASM key-derivation module.
    # style-src 'unsafe-inline' covers React inline styles and Google Fonts CSS;
    # it cannot be removed without breaking dynamic inline styles, so ZAP will
    # keep warning on it (accepted, low-risk: style injection, not script).
    # connect-src is scoped to self (the /api backend) plus Sentry SaaS ingest
    # (*.sentry.io); the broad https: scheme was replaced to drop the CSP
    # wildcard. If the Sentry DSN ever moves off sentry.io, widen this host.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-0EqkOPMejNoyMp9DmIVptxnB+KXrba93WqTv+LtZomU=' 'sha256-wxsMaksPnxSSUkEK2zJHNJkJnBOCpN0T7dBRf1b0GWA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;

    # The guest page (/view) has its own, stricter policy: no Sentry, no Google
    # Fonts, no inline scripts, nothing but this origin. The argon2 module still
    # needs 'wasm-unsafe-eval'.
    set $guest_csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";

    sub_filter_once off;
    sub_filter '__OG_LANG__'      $og_lang;
    sub_filter '__OG_LOCALE__'    $og_locale;
    sub_filter '__OG_TITLE__'     $og_title;
    sub_filter '__OG_DESC__'      $og_desc;
    sub_filter '__OG_ORIGIN__'    $og_origin;
    # Use $canonical_path (request URI minus query string). $uri would resolve
    # to /index.html for every SPA route after try_files rewrites it.
    # __OG_*__ placeholders are page-scoped: they include the current path so
    # the canonical / hreflang alternates in index.html point at the page the
    # visitor actually requested.
    sub_filter '__OG_CANONICAL__' '$og_origin$canonical_path';
    sub_filter '__OG_ALT_EN__'    '$og_alt_en$canonical_path';
    sub_filter '__OG_ALT_NL__'    '$og_alt_nl$canonical_path';
    # __BASE_*__ placeholders are origin-only (no path). Used by sitemap.xml,
    # which embeds the path itself on each <url> entry.
    sub_filter '__BASE_EN__'      $og_alt_en;
    sub_filter '__BASE_NL__'      $og_alt_nl;
    sub_filter '__GENOGRAM_PATH__' $genogram_path;

    location = /healthz {
        access_log off;
        return 200;
    }

    # Sitemap needs the same per-host substitution as index.html, but XML is not
    # in the default sub_filter_types — opt this single file in.
    location = /sitemap.xml {
        sub_filter_types application/xml text/xml;
        default_type application/xml;
        try_files $uri =404;
    }

    # robots.txt carries the absolute sitemap URL (the Sitemap directive
    # requires one); substitute the per-host origin like the sitemap itself.
    location = /robots.txt {
        sub_filter_types text/plain;
        try_files $uri =404;
    }

    # Prerendered landing pages: static HTML with page-specific meta baked in
    # at build time (scripts/prerender.mjs), so crawlers see title, canonical,
    # hreflang, and content without executing JavaScript. No __OG_*__
    # placeholders remain in these files, so sub_filter is a no-op here.
    location = /genogram {
        if ($genogram_en_offhost) {
            return 301 $genogram_en_offhost;
        }
        try_files /genogram.html =404;
    }

    location = /genogram-maken {
        if ($genogram_nl_offhost) {
            return 301 $genogram_nl_offhost;
        }
        try_files /genogram-maken.html =404;
    }

    # Translations are fetched at runtime and their filenames never change, so
    # they cannot be cache-busted the way /assets/ is. Without an explicit
    # directive a browser applies heuristic caching (roughly a tenth of the
    # file's age) and serves the stale copy without revalidating, so a deploy
    # that adds keys shows the raw key names to returning visitors until their
    # guess expires. no-cache still allows caching; it only requires a
    # revalidation first, which the ETag answers with an empty 304.
    location /locales/ {
        add_header Cache-Control "no-cache" always;
        # add_header in a location replaces the server block's set rather than
        # adding to it, so the full list is repeated here, as in /assets/.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Same problem, worse consequence: a stale index.html points at asset
    # hashes from an older build, which is what the app's chunk-reload path
    # exists to recover from.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # add_header in a location replaces the server block's set rather than
        # adding to it, so the full list is repeated here, as in /assets/.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Guest page: a separate build (vite.guest.config.ts) whose every request is
    # /view, /view-assets/* or /api/guest/open. None of them is access logged,
    # and the Cloud Logging exclusion filters on exactly these paths, so a guest
    # visit leaves no address in any hosting log.
    location = /view {
        access_log off;
        # Error lines carry the client address and the request line (a
        # limit_req rejection, a failed upstream), so only crit is written here.
        error_log /dev/stderr crit;
        add_header Cache-Control "no-store" always;
        # add_header in a location replaces the server block's set rather than
        # adding to it, so the full list is repeated here, with the guest
        # page's own Referrer-Policy and CSP.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy $guest_csp always;
        try_files /view-assets/view.html =404;
    }

    # Hashed bundle files plus the hashed argon2 script, so they can be cached
    # for good. log_not_found keeps a missing file out of the error log too.
    location ^~ /view-assets/ {
        access_log off;
        # Error lines carry the client address and the request line (a
        # limit_req rejection, a failed upstream), so only crit is written here.
        error_log /dev/stderr crit;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header in a location replaces the server block's set rather than
        # adding to it, so the full list is repeated here, with the guest
        # page's own Referrer-Policy and CSP.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy $guest_csp always;
    }

    # Every other spelling of the guest page would serve it with the main app's
    # weaker headers (or the main app itself), so it is refused or redirected.
    location = /view-assets/view.html {
        access_log off;
        return 404;
    }

    location = /view.html {
        access_log off;
        return 404;
    }

    location ^~ /view/ {
        access_log off;
        # Error lines carry the client address and the request line (a
        # limit_req rejection, a failed upstream), so only crit is written here.
        error_log /dev/stderr crit;
        # A relative Location: behind Cloud Run an absolute one would carry
        # the container's port.
        absolute_redirect off;
        return 301 /view;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # The guest open endpoint: unauthenticated, so the strict per-address budget
    # of the auth endpoints, and no access or error log line (see /view). The
    # optional trailing slash keeps /api/guest/open/ from reaching the logged
    # /api/ location; anchored at both ends, it shadows nothing else.
    location ~ ^/api/guest/open/?$ {
        access_log off;
        # Error lines carry the client address and the request line (a
        # limit_req rejection, a failed upstream), so only crit is written here.
        error_log /dev/stderr crit;
        limit_req_log_level info;
        limit_req zone=auth_general burst=5 nodelay;
        rewrite ^ /guest/open break;
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }

    # Owner endpoints that upload a guest copy (up to 5 MB of ciphertext, more
    # once base64 and JSON wrap it), above nginx's 1 MB default body limit.
    location ~ ^/api/trees/[^/]+/guest-links {
        client_max_body_size 8m;
        limit_req zone=api_global burst=30 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_strict burst=3 nodelay;
        limit_req zone=api_global burst=30 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }

    # The key ring is fetched and rewritten on every tree create, delete and
    # import, and only for a signed-in user. It shares the general API budget
    # rather than the strict one meant for unauthenticated auth endpoints.
    # Regex locations match in order, so this must stay above ^/api/auth/.
    location ~ ^/api/auth/key-ring$ {
        limit_req zone=api_global burst=30 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }

    location ~ ^/api/auth/ {
        limit_req zone=auth_general burst=5 nodelay;
        limit_req zone=api_global burst=30 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }

    location /api/ {
        limit_req zone=api_global burst=30 nodelay;
        proxy_pass ${API_URL}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
    }
}
